<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pumping main optimiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#14232C; --ink-2:#4F616B; --line:#D2DBD9;
  --pipe:#1D5E87; --pump:#2B8576; --rock:#A9772C; --rock-soft:#E8DAC2; --bad:#B03F36; --best:#F4E8D2; --plum:#7A4E86; --slate:#5C6B73; --help:#EAF2F7;
  --focus:#1D5E87;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E181E; --surface:#15232B; --surface-2:#1B2C35; --ink:#E1E9EC; --ink-2:#9AACB4; --line:#2A3D47;
  --pipe:#62A9D6; --pump:#4FBFA9; --rock:#D9A453; --rock-soft:#3B3225; --bad:#E27B70; --best:#33291A; --plum:#B58BC2; --slate:#8C9BA3; --help:#18303D; --focus:#62A9D6;
}}
:root[data-theme="dark"]{
  --bg:#0E181E; --surface:#15232B; --surface-2:#1B2C35; --ink:#E1E9EC; --ink-2:#9AACB4; --line:#2A3D47;
  --pipe:#62A9D6; --pump:#4FBFA9; --rock:#D9A453; --rock-soft:#3B3225; --bad:#E27B70; --best:#33291A; --plum:#B58BC2; --slate:#8C9BA3; --help:#18303D; --focus:#62A9D6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
[dir=rtl] body{line-height:1.6}
h1,h2,h3{font-stretch:78%;margin:0;line-height:1.15}
h1{font-size:22px;font-weight:700}
h2{font-size:20px;font-weight:700;margin-bottom:4px}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto}
.rail-head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.rail-head .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rail-head p{font-size:13px;margin-top:6px}
.rail-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:6px 10px;border-radius:6px;font-size:13px}
.btn:hover{border-color:var(--pipe)}
.btn.primary{background:var(--pipe);color:var(--surface);border-color:var(--pipe);font-weight:600}
.btn.lang{font-weight:600;white-space:nowrap}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;padding:13px 20px;font-weight:700;font-stretch:85%;font-size:15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-weight:400;color:var(--ink-2);font-size:18px}
details.sec[open]>summary::after{content:"–"}
.sec-body{padding:2px 20px 16px}
.f{display:grid;grid-template-columns:1fr 118px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.f label i,.f .lb i{font-style:normal;color:var(--ink-2);font-size:12px}
.f small{display:block;color:var(--ink-2);font-size:11.5px;line-height:1.3}
input[type=number],input[type=text],select{width:100%;font:inherit;font-size:13.5px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--ink)}
input[type=number]{text-align:end}
.hb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--pipe);background:transparent;color:var(--pipe);font-size:11px;font-weight:700;padding:0;margin-inline-start:4px;vertical-align:1px;line-height:1}
.hb[aria-expanded=true]{background:var(--pipe);color:var(--surface)}
.hx{background:var(--help);border-radius:8px;padding:10px 12px;margin:2px 0 8px;font-size:13px;line-height:1.5}
.hx svg{display:block;width:100%;max-width:330px;height:auto;margin:8px auto 0}
.fg text{font-size:11px;fill:var(--ink-2);font-family:"Archivo","IBM Plex Sans Arabic",sans-serif}
.chk{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.chk input{width:16px;height:16px;accent-color:var(--pipe);flex:none}
.fams{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin:4px 0 6px}
.note{font-size:12px;color:var(--ink-2);margin:6px 0 4px}
.site{display:grid;grid-template-columns:1fr 92px 92px;gap:6px 8px;align-items:center;font-size:13px;margin:4px 0 10px}
.site .h{font-weight:700;font-size:12px;color:var(--ink-2);text-align:end}
.risk{padding:6px 0}
.risk .top{display:flex;justify-content:space-between;font-size:13.5px}
.risk .top b{font-weight:600;color:var(--pipe)}
.risk input{width:100%;accent-color:var(--pipe)}
.tbl-wrap{overflow-x:auto;margin:6px 0 10px;border:1px solid var(--line);border-radius:6px}
table.mini{border-collapse:collapse;font-size:12.5px;width:100%}
table.mini th,table.mini td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:end}
table.mini th:first-child,table.mini td:first-child{text-align:start;position:sticky;inset-inline-start:0;background:var(--surface)}
table.mini thead th{background:var(--surface-2);font-weight:600}
table.mini input{width:62px;padding:3px 4px;font-size:12.5px}
details.valves{margin:8px 0;border:1px solid var(--line);border-radius:6px}
details.valves>summary{padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer}
details.valves .vb{padding:0 10px 8px;max-height:260px;overflow-y:auto}
.ro{text-align:end;font-weight:600;padding-inline-end:8px}
.bad{color:var(--bad)}

.main{padding:26px clamp(16px,3vw,40px) 60px;min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:28px}
.verdict{font-stretch:72%;font-weight:750;font-size:clamp(28px,4vw,44px);line-height:1.05;letter-spacing:-0.01em}
[dir=rtl] .verdict{letter-spacing:0;line-height:1.25}
.verdict .sub{display:block;font-weight:400;font-stretch:100%;font-size:15px;letter-spacing:0;color:var(--ink-2);margin-top:10px;line-height:1.6;max-width:75ch}
.kpis{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:13px;color:var(--ink-2)}
.kpis b{display:block;font-size:19px;color:var(--ink);font-stretch:85%;font-weight:650}
.profile-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 10px}
.profile-box .cap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.cv{position:relative;width:100%}
.cv.tall{height:330px}
.cv.med{height:270px}
.block{margin:30px 0}
.block>p.muted{font-size:13.5px;margin-bottom:12px;max-width:80ch}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
table.cmp th,table.cmp td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:end;white-space:nowrap}
table.cmp th{font-weight:600;color:var(--ink-2);font-size:12.5px;background:var(--surface-2);vertical-align:bottom;white-space:normal;min-width:70px}
table.cmp th:first-child,table.cmp td:first-child{text-align:start}
table.cmp tbody tr[data-n]{cursor:pointer}
table.cmp tbody tr[data-n]:hover td{background:var(--surface-2)}
table.cmp tr.best td{background:var(--best)}
table.cmp tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--pipe)}
[dir=rtl] table.cmp tr.sel td:first-child{box-shadow:inset -4px 0 0 var(--pipe)}
table.cmp td.na{color:var(--bad);text-align:start;white-space:normal}
.tag{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--rock);color:var(--surface);margin-inline-start:6px;font-weight:600;vertical-align:1px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{margin-bottom:3px}
.card p.muted{font-size:12.5px;margin-bottom:10px}
.detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.full{grid-column:1/-1}
dl.kv{display:grid;grid-template-columns:1fr auto;margin:8px 0 0;font-size:13.5px}
dl.kv dt,dl.kv dd{padding:5px 0;border-bottom:1px solid var(--line);margin:0}
dl.kv dt{color:var(--ink-2);padding-inline-end:10px}
dl.kv dd{text-align:end;font-weight:600}
dl.kv .tot{font-weight:750;color:var(--ink);border-bottom:none}
.assume{font-size:13px;color:var(--ink-2);max-width:85ch}
.assume li{margin:4px 0}
.fail{background:var(--surface);border:1px solid var(--bad);border-radius:10px;padding:16px;font-size:14px}
.fail ul{margin:8px 0 0;padding-inline-start:18px}
dialog#dlg{width:min(1180px,96vw);max-height:92vh;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px 22px}
dialog#dlg::backdrop{background:rgba(10,20,26,.55)}
.trace-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px;margin:10px 0;background:#fff;direction:ltr}
.trace-wrap canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none}
.trace-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trace-in label{font-size:13.5px;display:grid;gap:4px}
.trace-in i{font-style:normal;color:var(--ink-2);font-size:12px}
textarea{width:100%;font:inherit;font-size:13.5px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
[dir=rtl] .kpis b,[dir=rtl] dl.kv dd,[dir=rtl] table.cmp td:not(:first-child):not(.na),[dir=rtl] .ro,[dir=rtl] .profile-box .cap span{direction:ltr;unicode-bidi:isolate}
[dir=rtl] dl.kv dd,[dir=rtl] table.cmp td:not(:first-child):not(.na){text-align:left}
@media (max-width: 1150px){ .detail{grid-template-columns:1fr 1fr} }
@media (max-width: 900px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-inline-end:none;border-bottom:1px solid var(--line)}
  .grid2,.detail{grid-template-columns:1fr}
  .trace-in{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
</style>
</head>
<body>
<div class="layout">
  <aside class="rail" id="rail" aria-label="Inputs">
    <div class="rail-head">
      <div class="row"><h1 id="appTitle"></h1><button class="btn lang" id="langBtn"></button></div>
      <p class="muted" id="appIntro"></p>
      <div class="rail-actions"><button class="btn" id="resetAll"></button></div>
    </div>
    <div id="inputs"></div>
  </aside>
  <main class="main" id="out" aria-live="polite"></main>
</div>
<dialog id="dlg"></dialog>

<script>
// ===== MODEL CORE =====
const DN_LIST = [80,100,150,200,250,300,350,400,450,500,600,700,800];
const FAMILIES = {
  DI:    {name:'Ductile iron', layK:1.0},

  GRP:   {name:'GRP', layK:1.1},

const DEFAULT_CLASSES = [
  {id:'DI_PN16', fam:'DI',   name:'DI PN16',   limit:13,  idf:1.00, C:130, pf:1.00},

];
function basePrice(fam, dn){ // OMR/m supply+lay, normal soil (indicative)
  const lay = 6 + 0.035*dn;
  let m;
  if(fam==='DI') m = 0.00022*dn*dn + 0.12*dn + 4;
  else if(fam==='HDPE') m = 0.00030*dn*dn + 0.02*dn;
  else if(fam==='GRP') m = 0.00018*dn*dn + 0.06*dn + 3;
  else m = 0.00028*dn*dn + 0.15*dn + 8;
  return {m, lay: lay*FAMILIES[fam].layK};
}
function defaultPrices(classes){
  const p = {};
  DN_LIST.forEach(dn=>{ p[dn]={}; classes.forEach(c=>{
    const b = basePrice(c.fam, dn); p[dn][c.id] = Math.round((b.m*c.pf + b.lay)*10)/10; }); });
  return p;
}
const TERRAINS = {
  mountain_wadi:{label:'Steep mountain with wadis', fam:{DI:true,HDPE:false,GRP:false,STEEL:true}, lay:1.8, low:25},

    lang:'en', extremaMin:5, profile:null, extraStatic:5, minRun:200, boosterKm:'', avCost:2500, woCost:2000
  };
}

const RHO_G = 9.81; // kN/m3 per m head for water ~ rho*g/1000
const STD_MOTORS = [0.75,1.1,1.5,2.2,3,4,5.5,7.5,11,15,18.5,22,30,37,45,55,75,90,110,132,160,200,250,315,355,400,450,500,560,630,710,800,900,1000,1120,1250,1400,1600,1800,2000,2500,3000];
const IE3 = [[0.75,80.7],[1.1,82.7],[1.5,84.2],[2.2,85.9],[3,87.1],[4,88.1],[5.5,89.2],[7.5,90.1],[11,91.2],[15,91.9],[18.5,92.4],[22,92.7],[30,93.3],[37,93.7],[45,94.0],[55,94.3],[75,94.7],[90,95.0],[110,95.2],[132,95.4],[160,95.6],[200,95.8]];
function motorRating(kw){ for(const s of STD_MOTORS) if(s>=kw) return s; return Math.ceil(kw/100)*100; }
function motorEff(kw){
  if(kw<=IE3[0][0]) return IE3[0][1]/100;
  for(let i=1;i<IE3.length;i++){ if(kw<=IE3[i][0]){ const [a,ea]=IE3[i-1],[b,eb]=IE3[i];
    const t=(Math.log(kw)-Math.log(a))/(Math.log(b)-Math.log(a)); return (ea+t*(eb-ea))/100; } }
  return 0.958;
}
// Gulich correlation for best efficiency of radial pumps (Q per pump in m3/s)
function etaGulich(nq, Q){
  nq = Math.max(nq, 4);
  const ratio = 1/Math.max(Q,1e-4);
  const a = Q<=1 ? 1 : 0.5;
  const m = 0.08*a*Math.pow(ratio,0.15)*Math.pow(45/nq,0.06);
  return 1 - 0.095*Math.pow(ratio,m) - 0.3*Math.pow(0.35-Math.log10(nq/23),2)*Math.pow(ratio,0.05);
}
function selectPump(inp, Qp, H){ // returns {eta, stages, nq}
  if(inp.pumpMode==='fixed') return {eta: inp.fixedEff/100, stages:1, nq: inp.rpm*Math.sqrt(Qp)/Math.pow(H,0.75), fixed:true};
  const maxS = inp.pumpMode==='single' ? 1 : 10;
  let best=null;
  for(let s=1;s<=maxS;s++){
    const hs = H/s, nq = inp.rpm*Math.sqrt(Qp)/Math.pow(hs,0.75);
    let e = etaGulich(nq, Qp) - 0.012*(s-1);
    e = Math.min(0.90, Math.max(0.30, e));
    if(!best || e>best.eta+0.003) best={eta:e, stages:s, nq};
  }
  best.eta *= inp.serviceFactor;
  return best;
}
function hwLoss(L, Q, C, D){ return 10.67*L*Math.pow(Q,1.852)/(Math.pow(C,1.852)*Math.pow(D,4.87)); }

// Assign pipe classes along one segment; pressure head falls linearly from Pd (start) to residual (end)
function assignClasses(inp, famClasses, Ls, PdHead){
  const f = 1 + inp.surgePct/100, low = inp.lowPoint;
  const d0 = (PdHead + low)*f*0.0981, d1 = (inp.residual + low)*f*0.0981; // bar
  const top = famClasses[famClasses.length-1];
  if(d0 > top.limit + 1e-9) return {ok:false, maxBar:d0};
  const parts = [];
  if(!inp.telescoping || Math.abs(d0-d1)<1e-9){
    const c = famClasses.find(c=>c.limit>=d0-1e-9); parts.push({cls:c, len:Ls});
  } else {
    // xAbove(k): length from start where design > limit_k
    const xAbove = lim => Math.min(Ls, Math.max(0, Ls*(d0-lim)/(d0-d1)));
    let prev = Ls;
    famClasses.forEach(c=>{ const xa = xAbove(c.limit); const len = prev - xa; if(len>1e-6) parts.push({cls:c, len}); prev = xa; });
    // parts listed from end of segment (low pressure) backwards; reverse to start->end
    parts.reverse();
  }
  return {ok:true, parts, maxBar:d0};
}


// ---------- Ground profile ----------
function prepProfile(inp){
  const pr=inp.profile; if(!pr||!pr.pts||pr.pts.length<2) return null;
  const pts=pr.pts.slice().sort((a,b)=>a[0]-b[0]);
  const x0=pts[0][0]; const P=pts.map(p=>[p[0]-x0,p[1]]);
  const L=P[P.length-1][0]; if(!(L>0)) return null;
  const M=Math.max(200,Math.min(1500,Math.round(L/8)));
  const dx=L/M, xs=[], gs=[]; let j=0;
  for(let i=0;i<=M;i++){ const x=i*dx; while(j<P.length-2 && P[j+1][0]<x) j++;
    const [xa,za]=P[j],[xb,zb]=P[j+1]; const t=xb>xa?Math.max(0,Math.min(1,(x-xa)/(xb-xa))):0; xs.push(x); gs.push(za+t*(zb-za)); }
  const h=Math.max(0.5, inp.extremaMin||5), pk=[], vl=[]; let dir=0, hiI=0, loI=0;
  for(let i=1;i<=M;i++){
    if(gs[i]>gs[hiI]) hiI=i; if(gs[i]<gs[loI]) loI=i;
    if(dir!==-1 && gs[hiI]-gs[i]>=h){ if(hiI>0) pk.push(hiI); dir=-1; loI=i; }
    else if(dir!==1 && gs[i]-gs[loI]>=h){ if(loI>0) vl.push(loI); dir=1; hiI=i; }
  }
  const off=(pr.off||[]), tol=Math.max(25,2*dx);
  const mk=(i,kind)=>({i, x:xs[i], z:gs[i], kind, on:!off.some(o=>Math.abs(o-xs[i])<=tol)});
  const peaks=pk.map(i=>mk(i,'av')), valleys=vl.map(i=>mk(i,'wo'));
  return {xs,gs,L,dx,M,peaks,valleys,nAV:peaks.filter(p=>p.on).length,nWO:valleys.filter(p=>p.on).length,gMin:Math.min(...gs),gMax:Math.max(...gs)};
}
function stationIdx(inp, prof, N){
  const g0=prof.gs[0], gEnd=prof.gs[prof.M]+inp.extraStatic;
  const man=String(inp.boosterKm||'').split(/[,;\s]+/).map(parseFloat).filter(v=>isFinite(v)&&v>0&&v*1000<prof.L).sort((a,b)=>a-b);
  const idx=[0]; let manual=false;
  if(N>1 && man.length===N-1){ manual=true; man.forEach(k=>idx.push(Math.max(idx[idx.length-1]+1, Math.round(k*1000/prof.dx)))); }
  else for(let i=1;i<N;i++){
    const T=g0+i*(gEnd-g0)/N; let k=idx[idx.length-1]+1;
    while(k<prof.M && prof.gs[k]<T) k++;
    if(k>=prof.M || gEnd<=g0) k=Math.round(i*prof.M/N);
    idx.push(Math.max(k, idx[idx.length-1]+1));
  }
  idx.push(prof.M);
  for(let i=1;i<idx.length;i++) if(idx[i]<=idx[i-1]) return null;
  return {idx, manual};
}
function sectionOnProfile(inp, prof, ia, ib, famClasses, DN, Qs, last){
  const n=ib-ia, dx=prof.dx, f=1+inp.surgePct/100, minor=1+inp.minorPct/100;
  const lpm=famClasses.map(c=>hwLoss(1,Qs,c.C,DN/1000*c.idf)*minor);
  let cls=new Array(n).fill(0), out=null;
  for(let it=0; it<4; it++){
    const loss=[0]; for(let j=0;j<n;j++) loss.push(loss[j]+lpm[cls[j]]*dx);
    let H0=-Infinity;
    for(let k=0;k<=n;k++){ const g=prof.gs[ia+k]; const req=(k===n&&last ? g+inp.extraStatic : g)+inp.residual; H0=Math.max(H0, req+loss[k]); }
    const P=[]; for(let k=0;k<=n;k++) P.push(H0-loss[k]-prof.gs[ia+k]);
    const need=[]; let maxBar=0;
    for(let j=0;j<n;j++){ const b=Math.max(P[j],P[j+1])*f*0.0981; if(b>maxBar) maxBar=b;
      const ci=famClasses.findIndex(c=>c.limit>=b-1e-9); if(ci<0) return {ok:false, maxBar:b}; need.push(ci); }
    let nc;
    if(!inp.telescoping){ const mx=Math.max(...need); nc=need.map(()=>mx); }
    else {
      const minSteps=Math.max(1,Math.round((inp.minRun||0)/dx));
      nc=need.slice();
      // upgrade any run shorter than the minimum length to its weaker neighbour (never below what it needs)
      for(let pass=0; pass<20; pass++){
        const runs=[]; let s=0; for(let j=1;j<=n;j++) if(j===n||nc[j]!==nc[s]){ runs.push([s,j,nc[s]]); s=j; }
        let changed=false;
        for(let q=0;q<runs.length;q++){ const [a,b,c]=runs[q]; if(b-a>=minSteps||runs.length===1) continue;
          const l=q>0?runs[q-1][2]:-1, r=q<runs.length-1?runs[q+1][2]:-1;
          const cand=[l,r].filter(v=>v>c); if(!cand.length) continue;
          const to=Math.min(...cand); for(let j=a;j<b;j++) nc[j]=to; changed=true; break; }
        if(!changed) break;
      }
    }
    cls=nc; out={H0,loss,P,maxBar};
  }
  const WL=prof.gs[ia], parts=[];
  for(let j=0;j<n;j++){ const c=famClasses[cls[j]]; const xa=prof.xs[ia+j], xb=prof.xs[ia+j+1];
    if(parts.length && parts[parts.length-1].cls===c){ parts[parts.length-1].len+=dx; parts[parts.length-1].x1=xb; } else parts.push({cls:c,len:dx,x0:xa,x1:xb}); }
  const hgl=[[prof.xs[ia],WL]]; const step=Math.max(1,Math.round(n/150));
  for(let k=0;k<=n;k+=step) hgl.push([prof.xs[ia+k], out.H0-out.loss[k]]);
  if(n%step) hgl.push([prof.xs[ib], out.H0-out.loss[n]]);
  const endLevel = prof.gs[ib] + (last?inp.extraStatic:0);
  return {ok:true, parts, hf:out.loss[n], Pd:out.H0-WL, TDH:out.H0-WL+inp.stationLoss, maxBar:out.maxBar,
    Hs:endLevel-WL, x0:prof.xs[ia], x1:prof.xs[ib], WL, hgl};
}
function sectionsStraight(inp, N, DN, famClasses){
  const Qs=inp.Q/3600, Ls=inp.Lkm*1000/N, Hs=inp.hs/N;
  let assign={ok:true, parts:[{cls:famClasses[0], len:Ls}]}, hf=0, Pd=0;
  for(let it=0; it<4; it++){
    hf = assign.parts.reduce((s,p)=>s+hwLoss(p.len, Qs, p.cls.C, DN/1000*p.cls.idf),0)*(1+inp.minorPct/100);
    Pd = Hs + hf + inp.residual;
    const na = assignClasses(inp, famClasses, Ls, Pd);
    if(!na.ok) return {ok:false, maxBar:na.maxBar};
    assign = na;
  }
  const secs=[];
  for(let i=0;i<N;i++){
    const x0=i*Ls, g0=i*Hs; let pos=x0;
    const parts=assign.parts.map(p=>{ const o={cls:p.cls,len:p.len,x0:pos,x1:pos+p.len}; pos+=p.len; return o; });
    secs.push({ok:true, parts, hf, Pd, TDH:Pd+inp.stationLoss, maxBar:assign.maxBar, Hs, x0, x1:x0+Ls, WL:g0,
      hgl:[[x0,g0],[x0,g0+Pd],[x0+Ls,g0+Hs+inp.residual]]});
  }
  return {ok:true, secs};
}

function evalConfig(inp, N, DN, fam, tariffMult=1, prof){
  const famClasses = inp.classes.filter(c=>c.fam===fam).sort((a,b)=>a.limit-b.limit);
  if(!famClasses.length) return null;
  if(prof===undefined) prof=prepProfile(inp);
  const Qs = inp.Q/3600;
  // quick velocity screen using the family's extreme bores
  const idMin=Math.min(...famClasses.map(c=>c.idf))*DN/1000, idMax=Math.max(...famClasses.map(c=>c.idf))*DN/1000;
  if(Qs/(Math.PI*idMax*idMax/4) > inp.vmax || Qs/(Math.PI*idMin*idMin/4) < inp.vmin)
    return {feasible:false, velocity:true, reason:{code:'velocity'}, N, DN, fam};
  let secs, posInfo=null;
  if(prof){
    posInfo = stationIdx(inp, prof, N);
    if(!posInfo) return {feasible:false, reason:{code:'overlap'}, N, DN, fam};
    secs=[];
    for(let i=0;i<N;i++){
      const s=sectionOnProfile(inp, prof, posInfo.idx[i], posInfo.idx[i+1], famClasses, DN, Qs, i===N-1);
      if(!s.ok) return {feasible:false, reason:{code:'pressure', bar:s.maxBar, fam}, N, DN, fam};
      secs.push(s);
    }
  } else {
    const r=sectionsStraight(inp, N, DN, famClasses);
    if(!r.ok) return {feasible:false, reason:{code:'pressure', bar:r.maxBar, fam}, N, DN, fam};
    secs=r.secs;
  }
  const allParts=secs.flatMap(s=>s.parts);
  const minID=Math.min(...allParts.map(p=>DN/1000*p.cls.idf)), maxID=Math.max(...allParts.map(p=>DN/1000*p.cls.idf));
  const vMax=Qs/(Math.PI*minID*minID/4), vMin=Qs/(Math.PI*maxID*maxID/4);
  if(vMax > inp.vmax || vMin < inp.vmin) return {feasible:false, reason:{code:'velocity'}, N, DN, fam, velocity:true};

  const duty=Math.max(1, inp.duty|0), standby=Math.max(0, inp.standby|0), nPumps=duty+standby;
  const Qp=Qs/duty, hoursYr=inp.hours*365;
  const r=inp.risk;
  let mech=0, elec=0, surge=0, civil=0, grid=0, kWhYr=0, hydKW=0, elecKWtot=0;
  const stations=secs.map((s,i)=>{
    const pump=selectPump(inp, Qp, s.TDH);
    const shaft=RHO_G*Qp*s.TDH/pump.eta, rating=motorRating(shaft*1.15), etaM=motorEff(rating), elecPump=shaft/etaM;
    const site = i===0 ? inp.site.src : inp.site.bst;
    const pumpSet = inp.pumpA*Math.pow(rating, inp.pumpB)*(pump.stages>1 ? inp.msFactor : 1);
    mech += nPumps*pumpSet;
    elec += inp.elecBase + inp.elecPerKW*nPumps*rating;
    surge += inp.surgeCost;
    const tankVol = site.newTank ? inp.Q*inp.tankRetention/60 : 0;
    civil += (site.civil + tankVol*inp.tankRate)*site.transport + site.rockM3*inp.rockRate + site.roadKm*inp.roadRate + inp.landCost;
    grid += inp.gridFixed + site.gridKm*inp.gridRate;
    kWhYr += duty*elecPump*hoursYr + inp.auxKW*24*365;
    hydKW += RHO_G*Qs*s.TDH; elecKWtot += duty*elecPump;
    return {TDH:s.TDH, Hs:s.Hs, hf:s.hf, Pd:s.Pd, maxBar:s.maxBar, xKm:s.x0/1000, pump, shaft, rating, etaM, stationKW:duty*elecPump};
  });
  const volYr=inp.Q*hoursYr;

  const corrAdder=(fam==='DI'||fam==='STEEL') ? 0.03*(r.corrosion-1) : 0;
  let pipe=0; const classLen={};
  allParts.forEach(p=>{ const price=(inp.prices[DN] && inp.prices[DN][p.cls.id]) || 0; pipe+=p.len*price; classLen[p.cls.name]=(classLen[p.cls.name]||0)+p.len; });
  pipe *= inp.layFactor*(1+corrAdder);
  const nAV = prof ? prof.nAV : 0, nWO = prof ? prof.nWO : 0;
  const fit = nAV*inp.avCost + nWO*inp.woCost;
  const direct=pipe+fit+mech+elec+surge+civil+grid;
  const markup=(1+inp.contingency/100)*(1+inp.engineering/100);
  const capex=direct*markup;
  const cap={pipe:pipe*markup, fit:fit*markup, mech:mech*markup, elec:elec*markup, surge:surge*markup, civil:civil*markup, grid:grid*markup};

  const riskSt = 1 + 0.12*(r.remote-1) + 0.10*(r.access-1) + 0.08*(r.corrosion-1);
  const riskPipe = 1 + 0.05*(r.remote-1) + 0.10*(r.access-1) + 0.10*(r.corrosion-1);
  const meCap = cap.mech + cap.elec + cap.surge;
  const omYr1 = N*inp.stationOM*riskSt + inp.meMaint/100*meCap*riskSt + inp.pipeMaint/100*(cap.pipe+cap.fit)*riskPipe + inp.civilMaint/100*(cap.civil+cap.grid);
  const energyYr1 = kWhYr*inp.tariff*tariffMult;
  const meLife = Math.max(3, inp.meLife*(1-0.06*(r.corrosion-1)));
  const elLife = Math.max(3, inp.elecLife*(1-0.04*(r.corrosion-1)));
  const dr=inp.discount/100, T=Math.round(inp.period);
  let pvE=0,pvOM=0,pvRen=0,pvVol=0,nomE=0,nomOM=0,nomRen=0; const cum=[capex]; let lastMe=0,lastEl=0;
  for(let t=1;t<=T;t++){
    const df=Math.pow(1+dr,-t);
    const e=energyYr1*Math.pow(1+inp.tariffEsc/100,t-1), om=omYr1*Math.pow(1+inp.omEsc/100,t-1);
    let ren=0;
    if(t<T && t-lastMe>=meLife-1e-9){ ren+=cap.mech*Math.pow(1+inp.omEsc/100,t); lastMe=t; }
    if(t<T && t-lastEl>=elLife-1e-9){ ren+=cap.elec*Math.pow(1+inp.omEsc/100,t); lastEl=t; }
    pvE+=e*df; pvOM+=om*df; pvRen+=ren*df; pvVol+=volYr*df; nomE+=e; nomOM+=om; nomRen+=ren;
    cum.push(cum[cum.length-1]+e+om+ren);
  }
  const resid=cap.pipe*Math.max(0,1-T/inp.pipeLife) + cap.fit*Math.max(0,1-T/inp.pipeLife) + (cap.civil+cap.grid)*Math.max(0,1-T/inp.civilLife)
    + cap.mech*Math.max(0,1-(T-lastMe)/meLife) + cap.elec*Math.max(0,1-(T-lastEl)/elLife);
  const pvResid=resid*Math.pow(1+dr,-T);
  const npv=capex+pvE+pvOM+pvRen-pvResid;
  const TDHs=stations.map(s=>s.TDH), etas=stations.map(s=>s.pump.eta);
  const L = prof ? prof.L : inp.Lkm*1000;
  return {
    feasible:true, N, DN, fam, secs, stations, classLen, profile:!!prof, manualPos: posInfo?posInfo.manual:false,
    maxBar:Math.max(...secs.map(s=>s.maxBar)), TDHmax:Math.max(...TDHs), TDHmin:Math.min(...TDHs),
    etaMin:Math.min(...etas), etaMax:Math.max(...etas), ratingMax:Math.max(...stations.map(s=>s.rating)),
    hfTot:secs.reduce((a,s)=>a+s.hf,0), hsTot:secs.reduce((a,s)=>a+s.Hs,0), Lkm:L/1000,
    vMin, vMax, duty, standby, nPumps, nAV, nWO,
    wireToWater:hydKW/elecKWtot, stationKW:elecKWtot, kWhYr, volYr, kWhm3:kWhYr/volYr,
    capex, cap, omYr1, energyYr1, meLife, elLife,
    pvE, pvOM, pvRen, pvResid, npv, nomE, nomOM, nomRen, nominal:capex+nomE+nomOM+nomRen, lcc:npv/pvVol, cum
  };
}

function runModel(inp, tariffMult=1){
  const fams = Object.keys(FAMILIES).filter(f=>inp.families[f]);
  const byN = [];
  const prof = prepProfile(inp);
  for(let N=1; N<=Math.max(1,Math.min(6,inp.nmax|0)); N++){
    const grid = {}; let best=null; const reasons=[]; const all=[];
    DN_LIST.forEach(dn=>{
      let bestDN=null;
      fams.forEach(f=>{
        const r = evalConfig(inp, N, dn, f, tariffMult, prof);
        if(!r) return;
        if(!r.feasible){ reasons.push(r); return; }
        all.push(r);
        if(!bestDN || r.npv<bestDN.npv) bestDN=r;
      });
      grid[dn]=bestDN;
      if(bestDN && (!best || bestDN.npv<best.npv)) best=bestDN;
    });
    let reason = null;
    if(!best){
      const pr = reasons.find(x=>!x.velocity);
      reason = !fams.length ? {code:'nomat'} : (pr ? pr.reason : {code:'velocity'});
    }
    byN.push({N, best, grid, reason, all});
  }
  const feas = byN.filter(x=>x.best);
  const overall = feas.length ? feas.reduce((a,b)=>b.best.npv<a.best.npv?b:a).best : null;
  return {byN, overall, prof};
}
// Energy is linear in tariff, so sensitivity re-optimises from the stored options without re-running hydraulics
function tariffSensitivity(R, mults){
  return mults.map(m=>{ const perN=R.byN.map(x=>{ let b=null; x.all.forEach(o=>{ const v=o.npv+(m-1)*o.pvE; if(b===null||v<b) b=v; }); return b; });
    let w=null; perN.forEach((v,i)=>{ if(v!=null && (w===null || v<perN[w])) w=i; }); return {perN, winner: w===null?null:w+1}; });
}

  how:{prof:'الضغط هو خط الانحدار الهيدروليكي ناقص منسوب الأرض عند كل نقطة من المقطع. تُصمم كل مضخة بحيث يبقى خط الانحدار أعلى من كل نقطة عالية ومن منسوب التسليم بمقدار الضغط المتبقي على الأقل. ثم يُضاف سماح الطرق المائي قبل اختيار فئة الأنبوب، وتُدمج أطوال الفئات الأقصر من الحد الأدنى في الفئة المجاورة.',
       straight:'يُقسّم الرفع الاستاتيكي وطول الخط بالتساوي بين المحطات. وعلى طول كل جزء ينخفض الضغط خطياً من المضخة حتى الخزان التالي، ويُضاف سماح الطرق المائي وسماح الأودية على طول الجزء كاملاً، وهذا في جانب الأمان. حمّل مقطعاً طولياً لاستبدال ذلك بالمناسيب الحقيقية.',
       img:'تمت قراءة المقطع من صورة، لذا فدقة المناسيب بحدود بكسل واحد من الصورة. راجع النقاط المنخفضة الحرجة مع بيانات المساحة.',
       hw:'يُحسب الاحتكاك بمعادلة هازن-ويليامز. مقاسات HDPE هي القطر الخارجي وتُحوّل إلى القطر الداخلي بنسبة القطر الداخلي ÷ الاسمي.',
       eta:'تُقدّر كفاءة المضخة من السرعة النوعية (علاقة Gülich لنقطة الكفاءة القصوى) ثم تُخفض بمعامل الكفاءة أثناء الخدمة. في الوضع الافتراضي قد يختار النموذج مضخة متعددة المراحل إذا كانت أكفأ. عند توفر منحنيات المضخات الفعلية اختر "استخدم قيمتي".',
       fixed:'تعمل المضخات بسرعة ثابتة عند نقطة تشغيل واحدة. المحركات من فئة IE3 ومحددة بهامش 15%.',
       pv:(d,T)=>`التكلفة الحالية تخصم تكاليف الطاقة والتشغيل والصيانة والاستبدال بمعدل ${d}% وتطرح القيمة المتبقية للأصول في السنة ${T}.`,
       price:'الأسعار الافتراضية تقديرات تخطيطية تقريبية لسلطنة عُمان وليست أسعار مناقصات. استبدلها بأسعار حديثة من جداول الكميات قبل الاعتماد على النتائج في اتخاذ القرار.'},

 hs:{en:['Total static head','m','Lowest water level at source to delivery level'], ar:['الرفع الاستاتيكي الكلي','m','من أدنى منسوب مياه في المصدر إلى منسوب التسليم'], fig:'static',

 Lkm:{en:['Pipeline length','km',''], ar:['طول الخط','km',''], hen:'Length of the rising main measured along the route, not the straight-line distance between its two ends.', har:'طول خط الدفع مقاساً على طول المسار، وليس المسافة المستقيمة بين طرفيه.'},

 residual:{en:['Residual head at delivery','m','Also kept above every high point'], ar:['الضغط المتبقي عند التسليم','m','ويُحافظ عليه أيضاً فوق كل نقطة عالية'], fig:'static',

 minRun:{en:['Shortest length of one pipe class','m','Shorter runs join the neighbouring class'], ar:['أقصر طول لفئة أنبوب واحدة','m','الأطوال الأقصر تنضم إلى الفئة المجاورة'], fig:'telescope',

 boosterKm:{en:['Booster chainages','km','Optional, e.g. 2.4, 4.1'], ar:['مواقع محطات التقوية','km','اختياري، مثل 2.4, 4.1'],

 extremaMin:{en:['Smallest rise or dip that needs a valve','m','Ignores small bumps and profile noise'], ar:['أقل ارتفاع أو انخفاض يحتاج صماماً','m','لتجاهل التموجات الصغيرة وأخطاء المقطع'], fig:'valves',
   hen:'A high point needs an air valve, and a low point needs a washout, only when the rise or dip is meaningful. Bumps smaller than this height are ignored. Google Earth profiles are noisy, so 5 to 10 m is a sensible start. You can also untick single valves in the list.', har:'تحتاج النقطة العالية إلى صمام هواء، والنقطة المنخفضة إلى صمام تصريف، فقط إذا كان الارتفاع أو الانخفاض مؤثراً. تُتجاهل التموجات الأصغر من هذا الارتفاع. مقاطع Google Earth فيها تذبذب، لذا فالبداية المعقولة من 5 إلى 10 m. ويمكنك أيضاً إلغاء تحديد صمامات بعينها في القائمة.'},

 terrain:{en:['Area type','','Fills in typical values below'], ar:['نوع المنطقة','','يملأ القيم النموذجية أدناه'],
   hen:'Choosing an area type fills in typical values for pipe material, laying cost factor and low-point allowance. Ductile iron or steel suit steep wadi terrain where pipes can be exposed by floods; HDPE and GRP suit stable ground and corrosive soil. You can change every value afterwards.', har:'اختيار نوع المنطقة يملأ قيماً نموذجية لمادة الأنبوب ومعامل التمديد وسماح النقاط المنخفضة. الحديد المرن أو الفولاذ يناسبان المناطق الجبلية ذات الأودية حيث قد تكشف السيول الأنابيب، و HDPE و GRP يناسبان الأرض المستقرة والتربة الأكّالة. يمكنك تعديل كل القيم بعد ذلك.'},
 layFactor:{en:['Pipe-laying terrain factor','×','Rock trenching, wadi crossings, slopes'], ar:['معامل صعوبة التمديد','×','حفر صخري، عبور أودية، منحدرات'],
   hen:'Multiplies the pipe supply and lay price. 1.0 is normal soil with easy access. Use 1.3 to 1.5 for mixed rock and slopes, and 1.8 to 2.5 for hard rock trenching, wadi crossings and steep mountain sides.', har:'يُضرب في سعر توريد وتمديد الأنابيب. القيمة 1.0 لتربة عادية وسهلة الوصول، ومن 1.3 إلى 1.5 لتربة مختلطة بالصخور والمنحدرات، ومن 1.8 إلى 2.5 للحفر في الصخر الصلب وعبور الأودية وسفوح الجبال الحادة.'},
 lowPoint:{en:['Wadi low-point allowance','m','Extra pressure for dips below the straight line'], ar:['سماح النقاط المنخفضة في الأودية','m','ضغط إضافي للانخفاضات تحت الخط المستقيم'],
   hen:'Without a ground profile the main is drawn as a straight line from start to end, so dips into wadis are missed. This allowance adds extra pressure along the whole line to cover them. Load a ground profile to use real levels instead.', har:'بدون مقطع طولي يُرسم الخط كخط مستقيم من البداية إلى النهاية فلا تظهر الانخفاضات في الأودية. هذا السماح يضيف ضغطاً إضافياً على طول الخط كاملاً لتغطيتها. حمّل مقطعاً طولياً لاستخدام المناسيب الحقيقية بدلاً من ذلك.'},
 surgePct:{en:['Surge allowance','%','Added before checking the class'], ar:['سماح الطرق المائي','%','يُضاف قبل اختيار الفئة'], fig:'surge',
   hen:'When pumps stop suddenly, for example in a power cut, pressure waves travel up and down the main and the peaks can be far above the normal working pressure. This allowance is added to the working pressure before the pipe class is chosen. 15 to 30% is typical with surge protection; a surge analysis gives the real value.', har:'عند توقف المضخات فجأة، مثلاً عند انقطاع الكهرباء، تنتقل موجات ضغط ذهاباً وإياباً في الخط وقد تتجاوز القمم ضغط التشغيل العادي بكثير. يُضاف هذا السماح إلى ضغط التشغيل قبل اختيار فئة الأنبوب. القيم المعتادة من 15 إلى 30% مع وجود حماية من الطرق المائي، وتحليل الطرق المائي يعطي القيمة الحقيقية.'},
 telescoping:{en:['Step down to lighter pipe class as pressure falls','',''], ar:['النزول إلى فئة أخف كلما انخفض الضغط','',''], fig:'telescope',

 vmin:{en:['Minimum velocity','m/s',''], ar:['أقل سرعة','m/s',''], hen:'Below about 0.5 to 0.6 m/s, sediment and air can settle in the pipe.', har:'تحت نحو 0.5 إلى 0.6 m/s قد تترسب الرواسب ويتجمع الهواء في الأنبوب.'},

 minorPct:{en:['Minor losses','% of friction',''], ar:['الفواقد الثانوية','% من الاحتكاك',''], hen:'Losses at bends, tees, valves and fittings along the route, as a percentage of pipe friction. 5 to 15% is usual for a long main.', har:'الفواقد عند الأكواع والتفرعات والصمامات والقطع على طول المسار، كنسبة من احتكاك الأنبوب. من 5 إلى 15% معتاد للخطوط الطويلة.'},
 stationLoss:{en:['Losses inside each station','m','Suction, manifold, valves, meter'], ar:['الفواقد داخل كل محطة','m','السحب، المجمّع، الصمامات، العداد'], hen:'Head lost inside each pump station: suction pipe, strainer, non-return and isolating valves, flow meter and manifold. Usually 3 to 8 m.', har:'الفاقد داخل كل محطة ضخ: أنبوب السحب والمصفاة وصمامات عدم الرجوع والعزل وعداد التدفق والمجمّع. عادة من 3 إلى 8 m.'},
 rpm:{en:['Pump speed','',''], ar:['سرعة المضخة','',''], hen:'Most water pumps run at about 2950 rpm (2-pole motor) or 1480 rpm (4-pole motor) on a 50 Hz supply. Slower pumps wear less and suit larger flows; faster pumps are smaller and cheaper for high head.', har:'تعمل معظم مضخات المياه بنحو 2950 دورة/دقيقة (محرك بقطبين) أو 1480 دورة/دقيقة (محرك بأربعة أقطاب) على تردد 50 Hz. المضخات الأبطأ أقل تآكلاً وتناسب التدفقات الكبيرة، والأسرع أصغر وأرخص للرفع العالي.'},
 pumpMode:{en:['Pump efficiency','',''], ar:['كفاءة المضخة','',''], fig:'stages',
   hen:'The model estimates pump efficiency from flow and head. A pump for high head and small flow is inefficient with one impeller, so a multistage pump (several impellers in series in one casing) often does better. Choose "Use my value" when you have a pump from a manufacturer catalogue.', har:'يقدّر النموذج كفاءة المضخة من التدفق والرفع. المضخة ذات الرفع العالي والتدفق الصغير تكون ضعيفة الكفاءة بمروحة واحدة، لذا فالمضخة متعددة المراحل (عدة مراوح على التوالي في غلاف واحد) غالباً أفضل. اختر "استخدم قيمتي" عندما تكون لديك مضخة من كتالوج مصنّع.'},
 fixedEff:{en:['My pump efficiency','%','Only with "Use my value"'], ar:['كفاءة المضخة لدي','%','فقط مع "استخدم قيمتي"'], fig:'bep', hen:'Efficiency at the duty point, read from the manufacturer pump curve. Large, well-chosen pumps reach 80 to 88%; small pumps 60 to 75%.', har:'الكفاءة عند نقطة التشغيل من منحنى المضخة لدى المصنّع. المضخات الكبيرة المختارة جيداً تصل إلى 80–88%، والصغيرة 60–75%.'},
 serviceFactor:{en:['In-service efficiency factor','×','Wear and running off the best point'], ar:['معامل الكفاءة أثناء الخدمة','×','التآكل والتشغيل بعيداً عن النقطة المثلى'], fig:'bep',

 duty:{en:['Duty pumps per station','',''], ar:['المضخات العاملة في كل محطة','',''], fig:'duty', hen:'Pumps that run together to deliver the design flow. With 2 duty pumps, each delivers half the flow.', har:'المضخات التي تعمل معاً لتوصيل التدفق التصميمي. مع مضختين عاملتين تضخ كل واحدة نصف التدفق.'},

 tariffEsc:{en:['Tariff increase per year','%',''], ar:['الزيادة السنوية في التعرفة','%',''], hen:'Expected average yearly increase in electricity price over the analysis period. Use 0 for constant prices.', har:'متوسط الزيادة السنوية المتوقعة في سعر الكهرباء خلال فترة التحليل. استخدم 0 لأسعار ثابتة.'},
 auxKW:{en:['Station auxiliary load','kW','AC, lighting, SCADA, 24 h'], ar:['الأحمال المساعدة للمحطة','kW','تكييف، إنارة، سكادا، 24 ساعة'], hen:'Electricity used in each station even when the pumps are off: air conditioning for the panels, lighting, SCADA and telemetry. 2 to 5 kW for a small station in a hot climate.', har:'الكهرباء المستهلكة في كل محطة حتى أثناء توقف المضخات: تكييف اللوحات والإنارة وأنظمة سكادا والاتصالات. من 2 إلى 5 kW لمحطة صغيرة في مناخ حار.'},

   har:'المبنى والأساسات: مبنى المضخات والبلاطات والقواعد في الظروف العادية. نقل المواد يضاعف التكلفة المدنية للمواقع البعيدة أو الجبلية حيث يجب نقل الخرسانة والحديد. القطع الصخري: حجم الجبل المطلوب قطعه لتجهيز منصة المحطة. طريق الوصول: طول المسار أو الطريق الجديد للوصول إلى الموقع. المسافة إلى خط الكهرباء: طول الخط الهوائي الجديد حتى أقرب نقطة في الشبكة. خزان الكسر: محطات التقوية تحتاج عادة خزاناً تضخ منه، ومحطة المصدر غالباً لديها خزان قائم.'},

 stationOM:{en:['Fixed O&M per station per year','$','Operators, visits, security'], ar:['تشغيل وصيانة ثابتة لكل محطة سنوياً','$','مشغلون، زيارات، حراسة'], hen:'Yearly fixed cost of running each station: operator time and visits, security, cleaning, consumables and telemetry. The risk sliders add to this.', har:'التكلفة السنوية الثابتة لتشغيل كل محطة: وقت المشغلين والزيارات والحراسة والتنظيف والمستهلكات والاتصالات. أشرطة المخاطر تضيف إلى هذه القيمة.'},
 meMaint:{en:['Pump and electrical maintenance','% of cost / yr',''], ar:['صيانة المضخات والكهرباء','% من التكلفة سنوياً',''], hen:'Yearly repairs and servicing of pumps, motors and panels, as a percentage of their cost. 2 to 4% is typical.', har:'الإصلاحات والصيانة السنوية للمضخات والمحركات واللوحات كنسبة من تكلفتها. من 2 إلى 4% معتاد.'},

 msFactor:{en:['Multistage price factor','×',''], ar:['معامل سعر المضخة متعددة المراحل','×',''], fig:'stages', hen:'A multistage pump costs more than a single-stage pump of the same power. 1.1 to 1.3.', har:'المضخة متعددة المراحل أغلى من المضخة أحادية المرحلة بنفس القدرة. من 1.1 إلى 1.3.'},
 elecBase:{en:['Electrical and controls per station','$',''], ar:['الكهرباء والتحكم لكل محطة','$',''], hen:'Fixed electrical cost per station: MCC panel, cabling, earthing, lighting and SCADA/RTU.', har:'التكلفة الكهربائية الثابتة لكل محطة: لوحة التحكم بالمحركات والكابلات والتأريض والإنارة ووحدة سكادا.'},

 period:{en:['Analysis period','years',''], ar:['فترة التحليل','سنة',''], hen:'Number of years over which costs are compared. 25 years is common for water infrastructure.', har:'عدد السنوات التي تُقارن خلالها التكاليف. 25 سنة شائعة لمشاريع البنية التحتية للمياه.'},
 discount:{en:['Discount rate','%',''], ar:['معدل الخصم','%',''], hen:'Converts future costs to today\'s money, so a cost in year 20 counts less than a cost today. Government projects often use 5 to 8%. Higher rates favour options with lower CAPEX.', har:'يحوّل التكاليف المستقبلية إلى قيمتها اليوم، فالتكلفة في السنة 20 تُحسب أقل من تكلفة اليوم. المشاريع الحكومية تستخدم غالباً من 5 إلى 8%. المعدل الأعلى يرجّح الخيارات الأقل في التكلفة الرأسمالية.'},

 currency:{en:['Currency label','',''], ar:['رمز العملة','',''], hen:'Text shown with all costs. Change it if you enter prices in another currency.', har:'النص الذي يظهر مع كل التكاليف. غيّره إذا أدخلت الأسعار بعملة أخرى.'}

<script>
const KEY='pumpopt.v1';
function deepMerge(base, over){
  if(over===undefined||over===null) return base;
  if(typeof base!=='object'||base===null||Array.isArray(base)) return over;
  const o={...base}; for(const k in over) o[k] = (k in base) ? deepMerge(base[k], over[k]) : over[k]; return o;
}
function load(){ try{ const s=localStorage.getItem(KEY); if(s) return deepMerge(makeDefaults(), JSON.parse(s)); }catch(e){} return makeDefaults(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();
let sel = {N:null, DN:null};
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setP(o,p,v){ const ks=p.split('.'); let a=o; for(let i=0;i<ks.length-1;i++){ if(a[ks[i]]==null) a[ks[i]]={}; a=a[ks[i]]; } a[ks[ks.length-1]]=v; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lang=()=>S.lang==='ar'?'ar':'en';
const T=()=>I18N[lang()];
const cur=()=>esc(S.currency||'');
const isAr=()=>lang()==='ar';

// ---------- FIGURES FOR HELP NOTES ----------
function fig(name){
  const f=T().fig, a='stroke="var(--ink)" stroke-width="1.4" fill="none"';
  const arrow=(x,y1,y2)=>`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="var(--pipe)" stroke-width="1.5"/><path d="M${x-4} ${y1+6} L${x} ${y1} L${x+4} ${y1+6} M${x-4} ${y2-6} L${x} ${y2} L${x+4} ${y2-6}" stroke="var(--pipe)" stroke-width="1.5" fill="none"/>`;
  const svg=(h,body)=>`<svg class="fg" viewBox="0 0 320 ${h}" role="img" aria-hidden="true">${body}</svg>`;
  if(name==='static') return svg(165,`
    <path d="M10 140 L300 50" stroke="var(--rock)" stroke-width="2"/>
    <rect x="10" y="112" width="40" height="30" fill="var(--rock-soft)" stroke="var(--ink-2)"/><rect x="11" y="122" width="38" height="19" fill="var(--pipe)" opacity=".35"/>
    <rect x="268" y="22" width="44" height="30" fill="var(--rock-soft)" stroke="var(--ink-2)"/><rect x="269" y="30" width="42" height="21" fill="var(--pipe)" opacity=".35"/>
    <path d="M50 122 H250" stroke="var(--ink-2)" stroke-dasharray="4 3"/><path d="M215 30 H268" stroke="var(--ink-2)" stroke-dasharray="4 3"/>
    <path d="M55 12 L262 20" stroke="var(--ink)" stroke-width="2"/>
    ${arrow(232,30,122)}${arrow(290,20,30)}
    <text x="226" y="80" text-anchor="end">${f.static}</text><text x="292" y="14" text-anchor="middle">${f.residual}</text>
    <text x="140" y="10" text-anchor="middle">${f.hgl}</text><text x="30" y="158" text-anchor="middle">${f.source}</text><text x="290" y="66" text-anchor="middle">${f.delivery}</text>`);
  if(name==='surge') return svg(150,`
    <path d="M25 20 V130 H310" ${a}/>
    <path d="M25 40 H310" stroke="var(--bad)" stroke-dasharray="5 4"/><text x="305" y="34" text-anchor="end">${f.limit}</text>
    <path d="M25 90 H120 C135 90 135 52 150 52 S170 125 185 120 S205 66 220 70 S240 108 255 104 S275 82 290 86 L310 90" stroke="var(--pipe)" stroke-width="2" fill="none"/>
    <text x="70" y="84" text-anchor="middle">${f.working}</text><path d="M120 95 V128" stroke="var(--ink-2)" stroke-dasharray="3 3"/><text x="120" y="142" text-anchor="middle">${f.stop}</text>
    <text x="20" y="16">${f.pressure}</text><text x="305" y="142" text-anchor="end">${f.time}</text>`);
  if(name==='bep') return svg(150,`
    <path d="M30 15 V125 H310" ${a}/>
    <path d="M30 30 C120 34 220 60 300 115" stroke="var(--pipe)" stroke-width="2" fill="none"/><text x="60" y="26">${f.head}</text>
    <path d="M30 125 C90 40 230 40 300 110" stroke="var(--pump)" stroke-width="2" fill="none"/><text x="250" y="66" fill="var(--pump)">${f.eff}</text>
    <circle cx="165" cy="61" r="4.5" fill="var(--pump)"/><text x="165" y="50" text-anchor="middle">${f.bep}</text>
    <circle cx="232" cy="72" r="4.5" fill="none" stroke="var(--bad)" stroke-width="2"/><text x="236" y="90">${f.actual}</text>
    <text x="305" y="140" text-anchor="end">${f.flow}</text>`);
  if(name==='stages') return svg(110,`
    <rect x="60" y="30" width="200" height="50" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)"/>
    ${[95,135,175,215].map((x,i)=>`<circle cx="${x+5}" cy="55" r="15" fill="none" stroke="var(--pipe)" stroke-width="2"/><path d="M${x+5} 42 V68 M${x-8} 55 H${x+18}" stroke="var(--pipe)"/><text x="${x+5}" y="96" text-anchor="middle">${i+1}</text>`).join('')}
    <path d="M15 55 H58 M262 55 H305" stroke="var(--ink)" stroke-width="2"/><path d="M50 50 L58 55 L50 60 M297 50 L305 55 L297 60" stroke="var(--ink)" stroke-width="2" fill="none"/>
    <text x="30" y="46" text-anchor="middle">${f.inlet}</text><text x="285" y="46" text-anchor="middle">${f.outlet}</text>`);
  if(name==='duty') return svg(120,`
    <path d="M30 30 H290 M30 95 H290" stroke="var(--ink)" stroke-width="2"/>
    ${[80,160,240].map((x,i)=>`<path d="M${x} 30 V48 M${x} 78 V95" stroke="var(--ink)" stroke-width="2"/><circle cx="${x}" cy="63" r="15" fill="${i<2?'var(--pump)':'none'}" stroke="var(--pump)" stroke-width="2"/><text x="${x}" y="114" text-anchor="middle">${i<2?f.duty:f.standby}</text>`).join('')}`);
  if(name==='telescope') return svg(140,`
    <path d="M20 15 V110 H310" ${a}/>
    <path d="M20 25 L305 100" stroke="var(--pipe)" stroke-width="2"/><text x="40" y="22">${f.pressure}</text>
    <path d="M20 18 H120 V48 H215 V75 H305" stroke="var(--bad)" stroke-dasharray="5 4" fill="none"/>
    <rect x="20" y="116" width="100" height="10" fill="var(--rock)"/><rect x="120" y="116" width="95" height="10" fill="var(--pipe)"/><rect x="215" y="116" width="90" height="10" fill="var(--pump)"/>
    <text x="70" y="138" text-anchor="middle">PN40</text><text x="167" y="138" text-anchor="middle">PN25</text><text x="260" y="138" text-anchor="middle">PN16</text>`);
  if(name==='valves') return svg(130,`
    <path d="M10 110 L50 92 L58 88 L64 91 L70 86 L110 70 L140 40 L170 60 L200 100 L230 80 L260 55 L310 30" stroke="var(--rock)" stroke-width="2" fill="none"/>
    <path d="M140 30 l-6 -10 h12 z" fill="var(--pipe)"/><text x="140" y="14" text-anchor="middle">${T().av}</text>
    <path d="M200 110 l-6 10 h12 z" fill="var(--bad)"/><text x="200" y="128" text-anchor="middle">${T().wo}</text>
    <circle cx="64" cy="89" r="9" fill="none" stroke="var(--ink-2)" stroke-dasharray="3 2"/><text x="64" y="72" text-anchor="middle">${f.ignored}</text>`);
  return '';
}

// ---------- INPUT PANEL ----------
let PROF=null;
function lab(k){ const d=FL[k]; if(!d) return ['','','']; const v=(d[lang()]||d.en).slice(); v[1]=(v[1]||'').replace('$',S.currency||''); return v; }
function helpText(k){ const d=FL[k]; return d ? (isAr()?d.har:d.hen) : null; }
function hb(k){ return helpText(k) ? `<button type="button" class="hb" data-help="${k}" aria-expanded="false" aria-controls="hx-${k}" aria-label="${T().help}">?</button>` : ''; }
function hx(k){ const tx=helpText(k); return tx ? `<div class="hx" id="hx-${k}" hidden>${esc(tx)}${FL[k].fig?fig(FL[k].fig):''}</div>` : ''; }
function fieldHTML(f){
  const k=f.k, [L,U,N]=lab(f.lk||k), id='in-'+k.replace(/\./g,'-');
  const v=f.t==='ro'?f.val:getP(S,k);
  const label=`<span class="lb"><label for="${id}">${L}${U?` <i>${esc(U)}</i>`:''}</label>${hb(f.lk||k)}${(f.note||N)?`<small>${f.note||N}</small>`:''}</span>`;
  let ctl;
  if(f.t==='ro') ctl=`<span class="ro" id="${id}">${v}</span>`;
  else if(f.t==='sel') ctl=`<select id="${id}" data-k="${k}" data-t="${f.str?'text':'num'}">${f.opts.map(([val,txt])=>`<option value="${val}" ${String(val)===String(v)?'selected':''}>${txt}</option>`).join('')}</select>`;
  else if(f.t==='text') ctl=`<input type="text" id="${id}" data-k="${k}" data-t="text" value="${esc(v??'')}">`;
  else if(f.t==='chk') return `<div class="chk"><input type="checkbox" id="${id}" data-k="${k}" ${v?'checked':''}><label for="${id}">${L}</label>${hb(k)}</div>${hx(k)}`;
  else ctl=`<input type="number" id="${id}" data-k="${k}" step="${f.step||'any'}" value="${v}">`;
  return `<div class="f">${label}${ctl}</div>${hx(f.lk||k)}`;
}
const num=(k,step)=>({k,step,t:'num'});
function sectionDefs(){
  PROF=prepProfile(S);
  const t=T();
  return [
    {id:'route', open:true, fields:[
      ...(PROF ? [
        {k:'hs',t:'ro',val:(PROF.gs[PROF.M]+S.extraStatic-PROF.gs[0]).toFixed(0),note:t.fromProfile},
        {k:'Lkm',t:'ro',val:(PROF.L/1000).toFixed(2),note:t.fromProfile}
      ] : [num('hs',1), num('Lkm',0.1)]),
      num('Q',1), num('hours',0.5), num('residual',1),
      {k:'nmax',t:'sel',opts:[1,2,3,4,5,6].map(n=>[n,t.st(n)])}
    ]},
    {id:'profile', open:true, custom:'profile'},
    {id:'terrain', open:true, custom:'terrain'},
    {id:'hyd', fields:[num('vmin',0.05), num('vmax',0.05), num('minorPct',1), num('stationLoss',0.5)]},
    {id:'classes', custom:'classes'},
    {id:'pumps', fields:[
      {k:'rpm',t:'sel',opts:OPTS.rpm[lang()]}, {k:'pumpMode',t:'sel',str:true,opts:OPTS.pumpMode[lang()]},
      num('fixedEff',0.5), num('serviceFactor',0.01), num('duty',1), num('standby',1),
      num('tariff',0.001), num('tariffEsc',0.5), num('auxKW',0.5)]},
    {id:'site', custom:'site'},
    {id:'risk', custom:'risk'},
    {id:'equip', fields:[num('pumpA',10), num('pumpB',0.01), num('msFactor',0.01), num('elecBase',500), num('elecPerKW',5), num('surgeCost',500)]},
    {id:'fin', fields:[num('period',1), num('discount',0.25), num('contingency',1), num('engineering',1), num('pipeLife',1), num('civilLife',1), {k:'currency',t:'text'}]}
  ];

function profMsg(txt){ const el=document.getElementById('profMsg'); if(el) el.textContent=txt||''; }
function setProfile(pts, name, source){
  pts=pts.filter(p=>isFinite(p[0])&&isFinite(p[1])).sort((a,b)=>a[0]-b[0]);
  if(pts.length<2){ profMsg(T().twoPts); return false; }
  if(pts.length>1500){ const L=pts[pts.length-1][0]-pts[0][0], out=[]; let j=0;
    for(let i=0;i<=1499;i++){ const x=pts[0][0]+L*i/1499; while(j<pts.length-2&&pts[j+1][0]<x) j++; const [xa,za]=pts[j],[xb,zb]=pts[j+1]; const tt=xb>xa?(x-xa)/(xb-xa):0; out.push([x,za+tt*(zb-za)]); }
    pts=out; }
  S.profile={name, source, off:[], pts:pts.map(p=>[Math.round(p[0]*10)/10, Math.round(p[1]*10)/10])};
  sel={N:null,DN:null}; save(); renderInputs(); schedule(); return true;
}
function hav(a,b){ const R=6371000, r=Math.PI/180, dLa=(b[1]-a[1])*r, dLo=(b[0]-a[0])*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

async function unzipKml(buf){
  const t=T(), dv=new DataView(buf); let eo=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--) if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0) throw new Error(t.badKmz);
  const cnt=dv.getUint16(eo+10,true); let p=dv.getUint32(eo+16,true);
  for(let k=0;k<cnt;k++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(new Uint8Array(buf,p+46,nl));
    if(/\.kml$/i.test(name)){
      const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true); const data=new Uint8Array(buf,ds,csize);
      if(method===0) return new TextDecoder().decode(data);
      if(typeof DecompressionStream==='undefined') throw new Error(t.noInflate);
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    }
    p+=46+nl+el+cl;
  }
  throw new Error(t.noKmlIn);
}
function parseKML(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml'); const all=[...doc.getElementsByTagName('*')]; let best=[];
  all.forEach(el=>{ if(el.localName==='coordinates'){ const ll=el.textContent.trim().split(/\s+/).map(s=>s.split(',').map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1])).map(a=>[a[0],a[1],a[2]||0]); if(ll.length>best.length) best=ll; } });
  const gx=all.filter(e=>e.localName==='coord').map(e=>e.textContent.trim().split(/\s+/).map(Number)).filter(a=>a.length>=2).map(a=>[a[0],a[1],a[2]||0]);
  return gx.length>best.length ? gx : best;
}
function parseGPX(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml'); const all=[...doc.getElementsByTagName('*')];
  let pts=all.filter(e=>e.localName==='trkpt'); if(!pts.length) pts=all.filter(e=>e.localName==='rtept');
  return pts.map(e=>{ const ele=[...e.children].find(c=>c.localName==='ele'); return [parseFloat(e.getAttribute('lon')),parseFloat(e.getAttribute('lat')), ele?parseFloat(ele.textContent):0]; });
}
function parseTable(txt, forceKm){
  const rows=txt.split(/\r?\n/).map(l=>l.trim().split(/[\t,;]+|\s+/).map(s=>parseFloat(s)).filter(v=>isFinite(v))).filter(r=>r.length>=2).map(r=>[r[0],r[1]]);
  if(!rows.length) return [];
  const km = forceKm || Math.max(...rows.map(r=>r[0]))<=200;
  return rows.map(r=>[km?r[0]*1000:r[0], r[1]]);
}
async function loadFile(f){
  const t=T(); profMsg('');

    const ext=f.name.split('.').pop().toLowerCase(); let pts;
    if(ext==='kmz'||ext==='kml'||ext==='gpx'){
      const txt = ext==='kmz' ? await unzipKml(await f.arrayBuffer()) : await f.text();

    function draw(){
      ctx.drawImage(img,0,0); drawBox();
      if(st.trace){ ctx.save(); ctx.strokeStyle='#00B4E0'; ctx.lineWidth=2.5; ctx.beginPath(); st.trace.out.forEach(([x,y],i)=>i?ctx.lineTo(x,y+3):ctx.moveTo(x,y+3)); ctx.stroke(); ctx.restore(); }
      msg();
    }
    function result(){
      const D=parseFloat(document.getElementById('trD').value), mn=parseFloat(document.getElementById('trMin').value), mx=parseFloat(document.getElementById('trMax').value);
      if(!st.trace) return {err:t.trNotFound};
      if(!(D>0)||!isFinite(mn)||!isFinite(mx)||mx<=mn) return {err:t.trPartial(st.trace.xR-st.trace.xL), partial:true};
      const tr=st.trace, span=tr.yBot-tr.yTop||1;
      const pts=tr.out.map(([x,y])=>[(x-tr.xL)/(tr.xR-tr.xL)*D*1000, mn+(tr.yBot-y)/span*(mx-mn)]);
      return {pts, txt:t.trOk(pts[0][1].toFixed(0), pts[pts.length-1][1].toFixed(0), (D*1000/(tr.xR-tr.xL)).toFixed(1), ((mx-mn)/span).toFixed(1))};
    }
    function msg(){ const r=result(), el=document.getElementById('trMsg'); el.textContent=r.err||r.txt; el.className='note'+(r.err&&!r.partial?' bad':''); }
    const pos=e=>{ const r=cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)*W/r.width), Math.round((e.clientY-r.top)*H/r.height)]; };
    let down=null, dragged=false;
    cv.addEventListener('pointerdown',e=>{ down=pos(e); dragged=false; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove',e=>{ if(!down) return; const p=pos(e); if(Math.abs(p[0]-down[0])+Math.abs(p[1]-down[1])>6){ dragged=true;
      st.box={x0:Math.max(0,Math.min(down[0],p[0])),y0:Math.max(0,Math.min(down[1],p[1])),x1:Math.min(W-1,Math.max(down[0],p[0])),y1:Math.min(H-1,Math.max(down[1],p[1]))}; ctx.drawImage(img,0,0); drawBox(); } });
    cv.addEventListener('pointerup',e=>{ if(!down) return; const p=pos(e);
      if(!dragged){ const i=(p[1]*W+p[0])*4; if(data[i]+data[i+1]+data[i+2]<700) st.col=[data[i],data[i+1],data[i+2]]; }
      down=null; doTrace(); draw(); });
    ['trD','trMin','trMax'].forEach(id=>document.getElementById(id).addEventListener('input',msg));
    document.getElementById('dlgCancel').onclick=()=>dlg.close();
    document.getElementById('trUse').onclick=()=>{ const r=result(); if(r.err){ msg(); return; } setProfile(r.pts, file.name, 'image'); dlg.close(); };
    doTrace(); draw();
  };
  img.onerror=()=>profMsg(t.badImg);
  const rd=new FileReader(); rd.onload=()=>{ img.src=rd.result; }; rd.readAsDataURL(file);
}

// ---------- RESULTS ----------
let timer=null; function schedule(){ clearTimeout(timer); timer=setTimeout(render,180); }
const charts={};
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function money(v){ return `${cur()} ${Math.round(v).toLocaleString('en-US')}`; }
function mc(v){ const a=Math.abs(v); if(a>=1e6) return `${cur()} ${(v/1e6).toFixed(2)} M`; if(a>=1e4) return `${cur()} ${Math.round(v/1e3)}k`; return money(v); }
const n0=v=>Math.round(v).toLocaleString('en-US');
const famName=f=>T().fam[f];
const famShort=f=>({DI:'DI',HDPE:'HDPE',GRP:'GRP',STEEL:isAr()?'فولاذ':'Steel'})[f];
const rng=(a,b,d,u)=>Math.abs(a-b)<0.5*Math.pow(10,-d) ? `${a.toFixed(d)}${u}` : `${a.toFixed(d)}–${b.toFixed(d)}${u}`;
function nColors(){ return [css('--pipe'),css('--rock'),css('--pump'),css('--plum'),css('--slate'),css('--bad')]; }

function render(){
  const t=T(), R=runModel(S), out=document.getElementById('out');
  Object.values(charts).forEach(c=>c.destroy()); for(const k in charts) delete charts[k];
  if(!R.overall){
    out.innerHTML=`<div class="hero"><div class="verdict">${t.noneTitle}<span class="sub">${t.noneText}</span></div>
      <div class="fail"><b>${t.whyFailed}</b><ul>${R.byN.map(x=>`<li>${t.st(x.N)}: ${esc(t.reason(x.reason)||'')}</li>`).join('')}</ul></div></div>`;
    return;
  }
  const best=R.overall;
  if(sel.N==null || !R.byN[sel.N-1] || !R.byN[sel.N-1].best) sel={N:best.N, DN:null};
  let cfg=R.byN[sel.N-1].best;
  if(sel.DN && R.byN[sel.N-1].grid[sel.DN]) cfg=R.byN[sel.N-1].grid[sel.DN]; else sel.DN=null;

  const feas=R.byN.filter(x=>x.best).map(x=>x.best).sort((a,b)=>a.npv-b.npv), second=feas[1];
  const mults=[0.5,0.75,1,1.5,2,3,4], sens=tariffSensitivity(R,mults), winners=sens.map(s=>s.winner);
  const c=cur(), fx=m=>(S.tariff*m).toFixed(3);
  let tarNote='';
  const up=winners.findIndex((w,i)=>mults[i]>1 && w!==best.N && w!=null), lo=winners.findIndex((w,i)=>mults[i]<1 && w!==best.N && w!=null);
  tarNote = up>=0 ? t.tarUp(fx(mults[up]),c,winners[up]) : t.tarHolds(fx(4),c);
  if(lo>=0 && up<0) tarNote += t.tarLow(fx(mults[lo]),c,winners[lo]);
  const diff = second ? t.nextBest(second.N, mc(second.npv-best.npv), Math.round((second.npv/best.npv-1)*100)) : '';
  const viewing = (cfg.N!==best.N || cfg.DN!==best.DN) ? `<p class="muted" style="font-size:13px">${t.showing(cfg.N,cfg.DN)} <button class="btn" id="backBest">${t.showBest}</button></p>` : '';
  const classTxt=Object.entries(cfg.classLen).map(([k,v])=>`${k} ${(v/1000).toFixed(1)} km`).join(isAr()?'، ':', ');
  const ch=t.ch, k=t.kpi, hd=t.cmpHead(c,S.period);

  out.innerHTML=`
  <section class="hero">
    <div class="verdict">${t.verdict(best.N,best.DN,famName(best.fam))}
      <span class="sub">${cfg.profile?t.profPrefix:''}${t.lowest(S.period,mc(best.npv),best.lcc.toFixed(3),c)}${diff}${t.eShare(Math.round(best.pvE/best.npv*100))}${tarNote}</span></div>
    ${viewing}
    <div class="profile-box">
      <div class="cap"><h3>${t.profTitle(cfg.N,cfg.DN,famName(cfg.fam))}</h3><span class="muted" style="font-size:12.5px">${classTxt}</span></div>
      <div class="kpis" style="margin-bottom:10px">
        <div>${k[0]}<b>${rng(cfg.TDHmin,cfg.TDHmax,0,' m')}</b></div>
        <div>${k[1]}<b>${cfg.maxBar.toFixed(1)} bar</b></div>
        <div>${k[2]}<b>${mc(cfg.capex)}</b></div>
        <div>${k[3]}<b>${mc(cfg.energyYr1+cfg.omYr1)}</b></div>
        <div>${k[4]}<b>${cfg.kWhm3.toFixed(2)} kWh/m³</b></div>
      </div>
      <div class="cv tall"><canvas id="cProfile" aria-label="${t.profTitle(cfg.N,cfg.DN,famName(cfg.fam))}"></canvas></div>
    </div>
  </section>

  <section class="block">
    <h2>${t.cmpTitle}</h2><p class="muted">${t.cmpNote}</p>
    <div class="tbl-wrap" style="border-radius:10px"><table class="cmp">
      <thead><tr>${hd.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${R.byN.map(x=>{ const b=x.best;
        if(!b) return `<tr data-n="${x.N}" tabindex="0"><td>${t.st(x.N)}</td><td class="na" colspan="12">${t.notPossible}${esc(t.reason(x.reason)||'')}</td></tr>`;
        return `<tr data-n="${x.N}" tabindex="0" class="${b===best?'best':''} ${x.N===cfg.N?'sel':''}">
          <td>${t.st(x.N)}${b===best?`<span class="tag">${t.best}</span>`:''}</td><td>DN${b.DN} ${famShort(b.fam)}</td>
          <td>${mc(b.capex)}</td><td>${mc(b.energyYr1+b.omYr1)}</td><td><b>${mc(b.npv)}</b></td><td>${b.lcc.toFixed(3)}</td>
          <td>${mc(b.nominal)}</td><td>${rng(b.TDHmin,b.TDHmax,0,'')}</td><td>${b.maxBar.toFixed(1)}</td><td>${b.vMax.toFixed(2)}</td>
          <td>${rng(b.etaMin*100,b.etaMax*100,0,'%')}</td><td>${b.duty}+${b.standby} × ${b.ratingMax} kW</td><td>${b.kWhm3.toFixed(2)}</td></tr>`; }).join('')}
      </tbody></table></div>
  </section>

  <section class="block grid2">
    <div class="card"><h3>${ch.money}</h3><p class="muted">${ch.moneyN(S.period)}</p><div class="cv med"><canvas id="cPV"></canvas></div></div>
    <div class="card"><h3>${ch.dn}</h3><p class="muted">${ch.dnN}</p><div class="cv med"><canvas id="cDN"></canvas></div></div>
    <div class="card"><h3>${ch.cum}</h3><p class="muted">${ch.cumN}</p><div class="cv med"><canvas id="cCum"></canvas></div></div>
    <div class="card"><h3>${ch.tar}</h3><p class="muted">${ch.tarN(S.tariff,c)}</p><div class="cv med"><canvas id="cTar"></canvas></div></div>
  </section>

  <section class="block">
    <h2>${t.bdTitle(cfg.N,cfg.DN,famName(cfg.fam))}</h2><p class="muted">${t.bdNote(S.contingency,S.engineering)}</p>
    <div class="detail">
      <div class="card"><h3>${t.capT}</h3><dl class="kv">
        <dt>${t.cap.pipe}</dt><dd>${money(cfg.cap.pipe)}</dd>
        ${cfg.cap.fit>0?`<dt>${t.cap.fit}</dt><dd>${money(cfg.cap.fit)}</dd>`:''}
        <dt>${t.cap.mech}</dt><dd>${money(cfg.cap.mech)}</dd>
        <dt>${t.cap.elec}</dt><dd>${money(cfg.cap.elec)}</dd>
        <dt>${t.cap.surge}</dt><dd>${money(cfg.cap.surge)}</dd>
        <dt>${t.cap.civil}</dt><dd>${money(cfg.cap.civil)}</dd>
        <dt>${t.cap.grid}</dt><dd>${money(cfg.cap.grid)}</dd>
        <dt class="tot">${t.cap.total}</dt><dd class="tot">${money(cfg.capex)}</dd></dl></div>
      <div class="card"><h3>${t.lccT}</h3><dl class="kv">
        <dt>${t.lcc[0]}</dt><dd>${money(cfg.energyYr1)}</dd>
        <dt>${t.lcc[1]}</dt><dd>${money(cfg.omYr1)}</dd>
        <dt>${t.lcc[2]}</dt><dd>${money(cfg.pvE)}</dd>
        <dt>${t.lcc[3]}</dt><dd>${money(cfg.pvOM)}</dd>
        <dt>${t.lcc[4]}</dt><dd>${money(cfg.pvRen)}</dd>
        <dt>${t.lcc[5]}</dt><dd>−${money(cfg.pvResid)}</dd>
        <dt class="tot">${t.lcc[6]}</dt><dd class="tot">${money(cfg.npv)}</dd></dl></div>
      <div class="card"><h3>${t.ppT}</h3><dl class="kv">
        <dt>${t.pp.flow}</dt><dd>${(S.Q/cfg.duty).toFixed(0)} m³/h</dd>
        <dt>${t.pp.w2w}</dt><dd>${(cfg.wireToWater*100).toFixed(1)}%</dd>
        <dt>${t.pp.kw}</dt><dd>${cfg.stationKW.toFixed(0)} kW</dd>
        <dt>${t.pp.kwh}</dt><dd>${n0(cfg.kWhYr)} kWh</dd>
        <dt>${t.pp.hs}</dt><dd>${cfg.hsTot.toFixed(0)} m</dd>
        <dt>${t.pp.hf}</dt><dd>${cfg.hfTot.toFixed(1)} m</dd>
        <dt>${t.pp.v}</dt><dd>${rng(cfg.vMin,cfg.vMax,2,' m/s')}</dd>
        ${cfg.profile?`<dt>${t.pp.valves}</dt><dd>${cfg.nAV} / ${cfg.nWO}</dd>`:''}
        <dt>${t.pp.ren}</dt><dd>${t.pp.every(cfg.meLife.toFixed(0))}</dd></dl></div>
      <div class="card full"><h3>${t.stT}</h3>
        <p class="muted">${cfg.profile ? (cfg.manualPos ? t.stManual : t.stAuto) : t.stEqual}</p>
        <div class="tbl-wrap"><table class="cmp"><thead><tr>${t.stHead.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${cfg.stations.map((s,i)=>`<tr><td>${i===0?t.atSource:t.booster(i)}</td><td>${s.xKm.toFixed(2)}</td><td>${s.Hs.toFixed(0)}</td><td>${s.hf.toFixed(1)}</td><td>${s.TDH.toFixed(0)}</td><td>${s.maxBar.toFixed(1)}</td><td>${(s.pump.eta*100).toFixed(1)}%</td><td>${s.pump.stages}</td><td>${s.pump.nq.toFixed(1)}</td><td>${(s.etaM*100).toFixed(1)}%</td><td>${cfg.duty}+${cfg.standby} × ${s.rating} kW</td><td>${s.stationKW.toFixed(0)}</td></tr>`).join('')}</tbody></table></div></div>
    </div>
  </section>

  <section class="block">
    <h2>${t.howT}</h2>
    <ul class="assume">
      <li>${cfg.profile?t.how.prof:t.how.straight}</li>
      ${cfg.profile && S.profile && S.profile.source==='image' ? `<li>${t.how.img}</li>` : ''}
      <li>${t.how.hw}</li><li>${t.how.eta}</li><li>${t.how.fixed}</li><li>${t.how.pv(S.discount,S.period)}</li><li>${t.how.price}</li>
    </ul>
  </section>`;
  const bb=document.getElementById('backBest'); if(bb) bb.onclick=()=>{ sel={N:null,DN:null}; render(); };
  drawCharts(R,cfg,sens,mults);
}

function baseOpts(xTitle,yTitle){
  const ink=css('--ink-2'), line=css('--line'), fam='Archivo, "IBM Plex Sans Arabic", system-ui, sans-serif';
  return {responsive:true, maintainAspectRatio:false, animation:false, interaction:{mode:'nearest', intersect:false},
    plugins:{legend:{rtl:isAr(), labels:{color:ink, boxWidth:12, font:{family:fam,size:12}}}, tooltip:{rtl:isAr(), titleFont:{family:fam}, bodyFont:{family:fam}}},
    scales:{x:{title:{display:!!xTitle,text:xTitle,color:ink,font:{family:fam}}, ticks:{color:ink}, grid:{color:line}},
            y:{title:{display:!!yTitle,text:yTitle,color:ink,font:{family:fam}}, ticks:{color:ink}, grid:{color:line}}}};
}
function drawCharts(R,cfg,sens,mults){
  if(typeof Chart==='undefined') return;
  const t=T(), ch=t.ch, c=S.currency, cols=nColors(), labelsN=R.byN.map(x=>t.st(x.N));
  const kfmt=v=>Math.abs(v)>=1e6?(v/1e6)+' M':Math.abs(v)>=1e3?(v/1e3)+'k':v;
  // Profile
  const prof=R.prof, Lk=cfg.Lkm;
  const groundAt=xm=>{ if(!prof) return xm/(Lk*1000)*S.hs; const i=Math.min(prof.M-1,Math.max(0,Math.floor(xm/prof.dx))); const tt=(xm-prof.xs[i])/prof.dx; return prof.gs[i]+tt*(prof.gs[i+1]-prof.gs[i]); };
  const stp=prof?Math.max(1,Math.round(prof.M/600)):1;
  const groundSeg=(a,b)=>{ const o=[{x:a/1000,y:groundAt(a)}]; if(prof){ for(let i=Math.ceil(a/prof.dx/stp)*stp; i*prof.dx<b; i+=stp) if(i*prof.dx>a) o.push({x:prof.xs[i]/1000,y:prof.gs[i]}); } o.push({x:b/1000,y:groundAt(b)}); return o; };
  const famCls=S.classes.filter(k=>k.fam===cfg.fam).sort((a,b)=>a.limit-b.limit);
  const clsCols=[css('--pump'),css('--pipe'),css('--rock'),css('--bad')];
  const parts=cfg.secs.flatMap(s=>s.parts);
  const clsSets=famCls.map((k,ci)=>{ const d=[]; parts.forEach(p=>{ if(p.cls.id===k.id) d.push(...groundSeg(p.x0,p.x1),{x:p.x1/1000,y:null}); });
    return d.length?{label:k.name,data:d,borderColor:clsCols[ci%4],backgroundColor:clsCols[ci%4],borderWidth:7,pointRadius:0,spanGaps:false,borderCapStyle:'butt',order:2}:null; }).filter(Boolean);
  const vset=[];
  if(prof){
    const on=[...prof.peaks,...prof.valleys].filter(v=>v.on), offv=[...prof.peaks,...prof.valleys].filter(v=>!v.on);
    const av=on.filter(v=>v.kind==='av'), wo=on.filter(v=>v.kind==='wo');
    if(av.length) vset.push({label:ch.av,type:'scatter',valve:true,data:av.map(v=>({x:v.x/1000,y:v.z})),pointStyle:'triangle',pointRadius:7,pointHoverRadius:9,backgroundColor:css('--pipe'),borderColor:css('--surface'),order:0});
    if(wo.length) vset.push({label:ch.wo,type:'scatter',valve:true,data:wo.map(v=>({x:v.x/1000,y:v.z})),pointStyle:'triangle',rotation:180,pointRadius:7,pointHoverRadius:9,backgroundColor:css('--bad'),borderColor:css('--surface'),order:0});
    if(offv.length) vset.push({label:ch.removed,type:'scatter',valve:true,data:offv.map(v=>({x:v.x/1000,y:v.z})),pointStyle:'circle',pointRadius:5,pointHoverRadius:8,backgroundColor:'transparent',borderColor:css('--slate'),borderWidth:1.5,order:0});
  }
  const po=baseOpts(ch.dist, prof?ch.lvlProf:ch.lvl);
  po.scales.x.type='linear'; po.scales.x.min=-Lk*0.015; po.scales.x.max=Lk;
  po.scales.y.min=prof?Math.floor((prof.gMin-0.05*(prof.gMax-prof.gMin+1))/10)*10:0;
  po.plugins.tooltip.callbacks={label:x=>ch.tip(x.dataset.label,x.parsed.y.toFixed(0),x.parsed.x.toFixed(2))};
  po.onClick=(ev,els,chart)=>{ const hit=chart.getElementsAtEventForMode(ev,'nearest',{intersect:true},false).find(h=>chart.data.datasets[h.datasetIndex].valve);
    if(!hit) return; const pt=chart.data.datasets[hit.datasetIndex].data[hit.index]; toggleValve(pt.x*1000); save(); setTimeout(()=>{ renderInputs(); render(); },0); };
  po.onHover=(ev,els,chart)=>{ const hit=chart.getElementsAtEventForMode(ev,'nearest',{intersect:true},false).some(h=>chart.data.datasets[h.datasetIndex].valve); ev.native.target.style.cursor=hit?'pointer':'default'; };
  charts.p=new Chart(document.getElementById('cProfile'),{type:'line',data:{datasets:[
    {label:ch.hgl,data:cfg.secs.flatMap(s=>s.hgl.map(([x,y])=>({x:x/1000,y}))),borderColor:css('--ink'),borderWidth:2,pointRadius:0,order:1},
    ...clsSets,
    {label:ch.station,type:'scatter',data:cfg.secs.map(s=>({x:s.x0/1000,y:s.WL})),pointStyle:'rectRot',pointRadius:8,backgroundColor:css('--ink'),borderColor:css('--surface'),borderWidth:2,order:0},
    ...vset,
    {label:ch.ground,data:groundSeg(0,Lk*1000),borderColor:css('--rock'),borderWidth:1,backgroundColor:css('--rock-soft'),fill:'start',pointRadius:0,order:5}
  ]},options:po});
  // PV
  const pick=f=>R.byN.map(x=>x.best?f(x.best):null);
  const pvo=baseOpts('',ch.pvAxis(c)); pvo.scales.x.stacked=true; pvo.scales.y.stacked=true; pvo.scales.y.ticks.callback=kfmt;
  pvo.plugins.tooltip.callbacks={label:x=>`${x.dataset.label}: ${mc(x.parsed.y)}`};
  const sn=ch.sets;
  charts.pv=new Chart(document.getElementById('cPV'),{type:'bar',data:{labels:labelsN,datasets:[
    {label:sn[0],data:pick(b=>b.capex),backgroundColor:css('--pipe')},{label:sn[1],data:pick(b=>b.pvE),backgroundColor:css('--rock')},
    {label:sn[2],data:pick(b=>b.pvOM),backgroundColor:css('--pump')},{label:sn[3],data:pick(b=>b.pvRen),backgroundColor:css('--plum')},
    {label:sn[4],data:pick(b=>-b.pvResid),backgroundColor:css('--slate')}]},options:pvo});
  // DN
  const dno=baseOpts(ch.dnAxis,ch.costAxis(c)); dno.scales.y.ticks.callback=kfmt;
  dno.plugins.tooltip.callbacks={label:x=>{ const g=R.byN[x.datasetIndex].grid[DN_LIST[x.dataIndex]]; return g?`${t.st(g.N)}, ${famName(g.fam)}: ${mc(g.npv)}`:''; }};
  dno.interaction={mode:'nearest',intersect:true};
  dno.onClick=(ev,els)=>{ if(!els.length) return; const e=els[0]; const g=R.byN[e.datasetIndex].grid[DN_LIST[e.index]]; if(g){ sel={N:g.N,DN:g.DN}; setTimeout(()=>{ render(); window.scrollTo({top:0}); },0); } };
  charts.dn=new Chart(document.getElementById('cDN'),{type:'line',data:{labels:DN_LIST.map(String),datasets:R.byN.map((x,i)=>({
    label:t.st(x.N),data:DN_LIST.map(dn=>x.grid[dn]?x.grid[dn].npv:null),borderColor:cols[i%6],backgroundColor:cols[i%6],pointRadius:4,pointHoverRadius:7,spanGaps:false,borderWidth:2}))},options:dno});
  // Cumulative
  const T2=Math.round(S.period);
  const co=baseOpts(ch.year,ch.cumAxis(c)); co.scales.y.ticks.callback=kfmt; co.plugins.tooltip.callbacks={label:x=>`${x.dataset.label}: ${mc(x.parsed.y)}`};
  charts.cum=new Chart(document.getElementById('cCum'),{type:'line',data:{labels:[...Array(T2+1).keys()],datasets:R.byN.filter(x=>x.best).map(x=>({
    label:t.st(x.N),data:x.best.cum,borderColor:cols[(x.N-1)%6],backgroundColor:cols[(x.N-1)%6],pointRadius:0,borderWidth:2}))},options:co});
  // Tariff
  const to=baseOpts(ch.tarAxis(c),ch.costAxis(c)); to.scales.y.ticks.callback=kfmt; to.plugins.tooltip.callbacks={label:x=>`${x.dataset.label}: ${mc(x.parsed.y)}`};
  charts.tar=new Chart(document.getElementById('cTar'),{type:'line',data:{labels:mults.map(m=>(S.tariff*m).toFixed(3)),datasets:R.byN.map((x,i)=>({
    label:t.st(x.N),data:sens.map(s=>s.perN[i]),borderColor:cols[i%6],backgroundColor:cols[i%6],pointRadius:3,borderWidth:2,spanGaps:false}))},options:to});
}

applyLang(); renderInputs(); render();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
